services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - motion-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  motion:
    build: .
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: motion
      PORT: "8787"
      SEED_DEMO: "false"
      ALLOW_SIGNUP: "true"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      OPS_TOKEN: "${OPS_TOKEN:-}"
      JWT_SECRET: "${JWT_SECRET:-change-me-motion-jwt-secret}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-change-me-motion-encryption-key}"
      AUTO_UPDATE: "off"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  motion-mongo:
