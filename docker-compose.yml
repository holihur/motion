services:
  mongo:
    image: mongo:7
    restart: unless-stopped
    volumes:
      - motion-mongo:/data/db
    healthcheck:
      test: ["CMD", "mongosh", "--quiet", "--eval", "db.runCommand({ ping: 1 }).ok"]
      interval: 10s
      timeout: 5s
      retries: 10

  motion:
    build:
      context: .
      args:
        VITE_CATCH_URL: ${VITE_CATCH_URL:-}
        VITE_CATCH_INGEST_KEY: ${VITE_CATCH_INGEST_KEY:-}
        VITE_CATCH_ENV: ${VITE_CATCH_ENV:-production}
        VITE_CATCH_SERVICE: ${VITE_CATCH_SERVICE:-motion-web}
        VITE_CATCH_RELEASE: ${VITE_CATCH_RELEASE:-}
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      MONGODB_URI: mongodb://mongo:27017
      MONGODB_DB: motion
      PORT: "8787"
      GO_ENV: "${GO_ENV:-production}"
      SEED_DEMO: "false"
      ALLOW_SIGNUP: "true"
      ADMIN_EMAILS: "${ADMIN_EMAILS:-}"
      OPS_TOKEN: "${OPS_TOKEN:-}"
      JWT_SECRET: "${JWT_SECRET:-change-me-motion-jwt-secret}"
      ENCRYPTION_KEY: "${ENCRYPTION_KEY:-change-me-motion-encryption-key}"
      AUTO_UPDATE: "off"
      CATCH_URL: "${CATCH_URL:-}"
      CATCH_KEY: "${CATCH_KEY:-}"
      CATCH_ENV: "${CATCH_ENV:-production}"
      CATCH_SERVICE: "${CATCH_SERVICE:-motion-api}"
      CATCH_RELEASE: "${CATCH_RELEASE:-}"
    depends_on:
      mongo:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://127.0.0.1:8787/api/health"]
      interval: 30s
      timeout: 5s
      retries: 5

volumes:
  motion-mongo:
