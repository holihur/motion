name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  server:
    name: Go server
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: server
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - name: Download modules
        run: go mod download
      - name: Vet
        run: go vet ./...
      - name: Test
        run: go test ./...
      - name: Build
        run: go build ./...

  web:
    name: React frontend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: web
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - run: pnpm build
      - uses: actions/upload-artifact@v4
        with:
          name: motion-web-dist
          path: web/dist
          retention-days: 3

  e2e:
    name: Playwright end-to-end
    runs-on: ubuntu-latest
    needs: [web]
    services:
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.runCommand({ ping: 1 }).ok'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: jdx/mise-action@v2
        with:
          install: true
          cache: true
      - uses: actions/download-artifact@v4
        with:
          name: motion-web-dist
          path: web/dist
      - name: Install frontend deps
        working-directory: web
        run: pnpm install --frozen-lockfile
      - name: Build API
        working-directory: server
        run: go build -o bin/motion-api ./cmd/server
      - name: Install e2e deps
        working-directory: e2e
        run: pnpm install --frozen-lockfile
      - name: Install Chromium
        working-directory: e2e
        run: pnpm exec playwright install --with-deps chromium
      - name: Run e2e
        working-directory: e2e
        env:
          MONGODB_URI: mongodb://127.0.0.1:27017
          MONGODB_DB: motion_e2e
          ADMIN_EMAILS: e2e-admin@example.com
        run: pnpm test
      - name: Upload failures
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-results
          path: |
            e2e/test-results
            e2e/playwright-report
          retention-days: 7
